name: Compilar APK de Wooly

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: wooly-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar el APK para descargar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Wooly.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima Wooly.apk --title "Wooly (última versión)" --notes "APK de prueba para instalar en Android." --latest
      - name: Guardar copia en la rama apk
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rq --cached .
          git add -f Wooly.apk
          git commit -qm "APK de ${GITHUB_SHA::7}"
          git push -f origin apk
